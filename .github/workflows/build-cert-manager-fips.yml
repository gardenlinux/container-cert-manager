name: Build FIPS cert-manager image

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      version:
        description: 'Upstream version to build (e.g. 1.21.2)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream version to build (e.g. 1.21.2)'
        required: false
        default: ''
permissions:
  packages: write
  contents: write

jobs:
  build-amd64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install syft
        env:
          SYFT_VERSION: '1.57.1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCH_SYFT=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          gh release download "v${SYFT_VERSION}" \
              --repo anchore/syft \
              --pattern "syft_${SYFT_VERSION}_linux_${ARCH_SYFT}.tar.gz" \
              --pattern "syft_${SYFT_VERSION}_checksums.txt" \
              --dir /tmp/syft-install
          grep "syft_${SYFT_VERSION}_linux_${ARCH_SYFT}.tar.gz" /tmp/syft-install/syft_${SYFT_VERSION}_checksums.txt | \
              (cd /tmp/syft-install && sha256sum -c)
          tar -xzf "/tmp/syft-install/syft_${SYFT_VERSION}_linux_${ARCH_SYFT}.tar.gz" -C /usr/local/bin syft
      - name: Build and push amd64 images
        env:
          VERSION: ${{ inputs.version || github.event.inputs.version }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/gl-fips-cert-manager
          ARCH: amd64
        run: |
          VERSION="${VERSION:-$(grep -m1 'VERSION:-' build-cert-manager-fips.sh | grep -oP '(?<=VERSION:-)[^}]+')}"
          bash build-cert-manager-fips.sh
          for COMPONENT in controller acmesolver cainjector webhook startupapicheck; do
            docker push ghcr.io/${{ github.repository_owner }}/gl-fips-cert-manager-${COMPONENT}:${VERSION}-amd64
          done
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-amd64
          path: .build/cert-manager-fips-build/*.cdx.json
          if-no-files-found: error

  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install syft
        env:
          SYFT_VERSION: '1.57.1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCH_SYFT=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          gh release download "v${SYFT_VERSION}" \
              --repo anchore/syft \
              --pattern "syft_${SYFT_VERSION}_linux_${ARCH_SYFT}.tar.gz" \
              --pattern "syft_${SYFT_VERSION}_checksums.txt" \
              --dir /tmp/syft-install
          grep "syft_${SYFT_VERSION}_linux_${ARCH_SYFT}.tar.gz" /tmp/syft-install/syft_${SYFT_VERSION}_checksums.txt | \
              (cd /tmp/syft-install && sha256sum -c)
          tar -xzf "/tmp/syft-install/syft_${SYFT_VERSION}_linux_${ARCH_SYFT}.tar.gz" -C /usr/local/bin syft
      - name: Build and push arm64 images
        env:
          VERSION: ${{ inputs.version || github.event.inputs.version }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/gl-fips-cert-manager
          ARCH: arm64
        run: |
          VERSION="${VERSION:-$(grep -m1 'VERSION:-' build-cert-manager-fips.sh | grep -oP '(?<=VERSION:-)[^}]+')}"
          bash build-cert-manager-fips.sh
          for COMPONENT in controller acmesolver cainjector webhook startupapicheck; do
            docker push ghcr.io/${{ github.repository_owner }}/gl-fips-cert-manager-${COMPONENT}:${VERSION}-arm64
          done
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-arm64
          path: .build/cert-manager-fips-build/*.cdx.json
          if-no-files-found: error

  push-manifest:
    runs-on: ubuntu-24.04
    needs: [build-amd64, build-arm64]
    outputs:
      image_digest_controller: ${{ steps.manifest.outputs.image_digest_controller }}
      image_digest_acmesolver: ${{ steps.manifest.outputs.image_digest_acmesolver }}
      image_digest_cainjector: ${{ steps.manifest.outputs.image_digest_cainjector }}
      image_digest_webhook: ${{ steps.manifest.outputs.image_digest_webhook }}
      image_digest_startupapicheck: ${{ steps.manifest.outputs.image_digest_startupapicheck }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest lists
        id: manifest
        env:
          VERSION: ${{ inputs.version || github.event.inputs.version }}
        run: |
          VERSION="${VERSION:-$(grep -m1 'VERSION:-' build-cert-manager-fips.sh | grep -oP '(?<=VERSION:-)[^}]+')}"
          for COMPONENT in controller acmesolver cainjector webhook startupapicheck; do
            docker manifest create \
              ghcr.io/${{ github.repository_owner }}/gl-fips-cert-manager-${COMPONENT}:${VERSION} \
              ghcr.io/${{ github.repository_owner }}/gl-fips-cert-manager-${COMPONENT}:${VERSION}-amd64 \
              ghcr.io/${{ github.repository_owner }}/gl-fips-cert-manager-${COMPONENT}:${VERSION}-arm64
            docker manifest push ghcr.io/${{ github.repository_owner }}/gl-fips-cert-manager-${COMPONENT}:${VERSION}
          done
          DIGEST_controller=$(docker manifest inspect \
            ghcr.io/${{ github.repository_owner }}/gl-fips-cert-manager-controller:${VERSION} \
            | jq -r '.manifests[0].digest')
          echo "image_digest_controller=${DIGEST_controller}" >> "$GITHUB_OUTPUT"
          DIGEST_acmesolver=$(docker manifest inspect \
            ghcr.io/${{ github.repository_owner }}/gl-fips-cert-manager-acmesolver:${VERSION} \
            | jq -r '.manifests[0].digest')
          echo "image_digest_acmesolver=${DIGEST_acmesolver}" >> "$GITHUB_OUTPUT"
          DIGEST_cainjector=$(docker manifest inspect \
            ghcr.io/${{ github.repository_owner }}/gl-fips-cert-manager-cainjector:${VERSION} \
            | jq -r '.manifests[0].digest')
          echo "image_digest_cainjector=${DIGEST_cainjector}" >> "$GITHUB_OUTPUT"
          DIGEST_webhook=$(docker manifest inspect \
            ghcr.io/${{ github.repository_owner }}/gl-fips-cert-manager-webhook:${VERSION} \
            | jq -r '.manifests[0].digest')
          echo "image_digest_webhook=${DIGEST_webhook}" >> "$GITHUB_OUTPUT"
          DIGEST_startupapicheck=$(docker manifest inspect \
            ghcr.io/${{ github.repository_owner }}/gl-fips-cert-manager-startupapicheck:${VERSION} \
            | jq -r '.manifests[0].digest')
          echo "image_digest_startupapicheck=${DIGEST_startupapicheck}" >> "$GITHUB_OUTPUT"

  release:
    runs-on: ubuntu-24.04
    needs: [build-amd64, build-arm64, push-manifest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download amd64 SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom-amd64
          path: sbom/
      - name: Download arm64 SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom-arm64
          path: sbom/
      - name: Generate SLSA provenance
        env:
          VERSION: ${{ inputs.version || github.event.inputs.version }}
          IMAGE_DIGEST_controller: ${{ needs.push-manifest.outputs.image_digest_controller }}
          IMAGE_DIGEST_acmesolver: ${{ needs.push-manifest.outputs.image_digest_acmesolver }}
          IMAGE_DIGEST_cainjector: ${{ needs.push-manifest.outputs.image_digest_cainjector }}
          IMAGE_DIGEST_webhook: ${{ needs.push-manifest.outputs.image_digest_webhook }}
          IMAGE_DIGEST_startupapicheck: ${{ needs.push-manifest.outputs.image_digest_startupapicheck }}
        run: |
          VERSION="${VERSION:-$(grep -m1 'VERSION:-' build-cert-manager-fips.sh | grep -oP '(?<=VERSION:-)[^}]+')}"
          python3 generate-provenance.py \
            --app cert-manager \
            --version "${VERSION}" \
            --image-name "ghcr.io/${{ github.repository_owner }}/gl-fips-cert-manager-controller:${VERSION}" \
            --image-digest "${{ needs.push-manifest.outputs.image_digest_controller }}" \
            --image-name "ghcr.io/${{ github.repository_owner }}/gl-fips-cert-manager-acmesolver:${VERSION}" \
            --image-digest "${{ needs.push-manifest.outputs.image_digest_acmesolver }}" \
            --image-name "ghcr.io/${{ github.repository_owner }}/gl-fips-cert-manager-cainjector:${VERSION}" \
            --image-digest "${{ needs.push-manifest.outputs.image_digest_cainjector }}" \
            --image-name "ghcr.io/${{ github.repository_owner }}/gl-fips-cert-manager-webhook:${VERSION}" \
            --image-digest "${{ needs.push-manifest.outputs.image_digest_webhook }}" \
            --image-name "ghcr.io/${{ github.repository_owner }}/gl-fips-cert-manager-startupapicheck:${VERSION}" \
            --image-digest "${{ needs.push-manifest.outputs.image_digest_startupapicheck }}" \
            --sbom-dir sbom/ \
            --output /tmp/provenance.json

      - name: Publish GitHub Release with SBOMs
        env:
          VERSION: ${{ inputs.version || github.event.inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${VERSION:-$(grep -m1 'VERSION:-' build-cert-manager-fips.sh | grep -oP '(?<=VERSION:-)[^}]+')}"
          {
            echo "FIPS-enabled cert-manager image v${VERSION}"
            echo ""
            for COMPONENT in controller acmesolver cainjector webhook startupapicheck; do
              echo '```'
              echo "docker pull ghcr.io/${{ github.repository_owner }}/gl-fips-cert-manager-${COMPONENT}:${VERSION}"
              echo '```'
              echo ""
            done
          } > /tmp/release-notes.md
          gh release create "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --title "v${VERSION}" \
            --notes-file /tmp/release-notes.md \
            || gh release edit "v${VERSION}" \
                 --repo "${{ github.repository }}" \
                 --title "v${VERSION}" \
                 --notes-file /tmp/release-notes.md
          gh release upload "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --clobber \
            sbom/*.cdx.json \
            /tmp/provenance.json
