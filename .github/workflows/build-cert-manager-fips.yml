name: Build FIPS cert-manager image

on:
  pull_request:
  workflow_call:
    inputs:
      version:
        description: 'Upstream version to build (e.g. 1.21.2)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream version to build (e.g. 1.21.2)'
        required: false
        default: ''
permissions:
  packages: write

jobs:
  build-amd64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install syft
        env:
          SYFT_VERSION: '1.56.0'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCH_SYFT=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          gh release download "v${SYFT_VERSION}" \
              --repo anchore/syft \
              --pattern "syft_${SYFT_VERSION}_linux_${ARCH_SYFT}.tar.gz" \
              --pattern "syft_${SYFT_VERSION}_checksums.txt" \
              --dir /tmp/syft-install
          grep "syft_${SYFT_VERSION}_linux_${ARCH_SYFT}.tar.gz" /tmp/syft-install/syft_${SYFT_VERSION}_checksums.txt | \
              (cd /tmp/syft-install && sha256sum -c)
          tar -xzf "/tmp/syft-install/syft_${SYFT_VERSION}_linux_${ARCH_SYFT}.tar.gz" -C /usr/local/bin syft
      - name: Build and push amd64 images
        env:
          VERSION: ${{ inputs.version || github.event.inputs.version }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/gl-fips-cert-manager
          ARCH: amd64
        run: |
          VERSION="${VERSION:-$(grep -m1 'VERSION:-' build-cert-manager-fips.sh | grep -oP '(?<=VERSION:-)[^}]+')}"
          bash build-cert-manager-fips.sh
          for COMPONENT in controller acmesolver cainjector webhook startupapicheck; do
            docker push ghcr.io/${{ github.repository_owner }}/gl-fips-cert-manager-${COMPONENT}:${VERSION}-amd64
          done
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-amd64
          path: .build/cert-manager-fips-build/*.cdx.json
          if-no-files-found: error

  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install syft
        env:
          SYFT_VERSION: '1.56.0'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCH_SYFT=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          gh release download "v${SYFT_VERSION}" \
              --repo anchore/syft \
              --pattern "syft_${SYFT_VERSION}_linux_${ARCH_SYFT}.tar.gz" \
              --pattern "syft_${SYFT_VERSION}_checksums.txt" \
              --dir /tmp/syft-install
          grep "syft_${SYFT_VERSION}_linux_${ARCH_SYFT}.tar.gz" /tmp/syft-install/syft_${SYFT_VERSION}_checksums.txt | \
              (cd /tmp/syft-install && sha256sum -c)
          tar -xzf "/tmp/syft-install/syft_${SYFT_VERSION}_linux_${ARCH_SYFT}.tar.gz" -C /usr/local/bin syft
      - name: Build and push arm64 images
        env:
          VERSION: ${{ inputs.version || github.event.inputs.version }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/gl-fips-cert-manager
          ARCH: arm64
        run: |
          VERSION="${VERSION:-$(grep -m1 'VERSION:-' build-cert-manager-fips.sh | grep -oP '(?<=VERSION:-)[^}]+')}"
          bash build-cert-manager-fips.sh
          for COMPONENT in controller acmesolver cainjector webhook startupapicheck; do
            docker push ghcr.io/${{ github.repository_owner }}/gl-fips-cert-manager-${COMPONENT}:${VERSION}-arm64
          done
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-arm64
          path: .build/cert-manager-fips-build/*.cdx.json
          if-no-files-found: error

  push-manifest:
    runs-on: ubuntu-24.04
    needs: [build-amd64, build-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest lists
        env:
          VERSION: ${{ inputs.version || github.event.inputs.version }}
        run: |
          VERSION="${VERSION:-$(grep -m1 'VERSION:-' build-cert-manager-fips.sh | grep -oP '(?<=VERSION:-)[^}]+')}"
          for COMPONENT in controller acmesolver cainjector webhook startupapicheck; do
            docker manifest create \
              ghcr.io/${{ github.repository_owner }}/gl-fips-cert-manager-${COMPONENT}:${VERSION} \
              ghcr.io/${{ github.repository_owner }}/gl-fips-cert-manager-${COMPONENT}:${VERSION}-amd64 \
              ghcr.io/${{ github.repository_owner }}/gl-fips-cert-manager-${COMPONENT}:${VERSION}-arm64
            docker manifest push ghcr.io/${{ github.repository_owner }}/gl-fips-cert-manager-${COMPONENT}:${VERSION}
          done

  release:
    runs-on: ubuntu-24.04
    needs: [build-amd64, build-arm64, push-manifest]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download amd64 SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom-amd64
          path: sbom/
      - name: Download arm64 SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom-arm64
          path: sbom/
      - name: Publish GitHub Release with SBOMs
        env:
          VERSION: ${{ inputs.version || github.event.inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${VERSION:-$(grep -m1 'VERSION:-' build-cert-manager-fips.sh | grep -oP '(?<=VERSION:-)[^}]+')}"
          gh release create "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --title "v${VERSION}" \
            --notes "FIPS-enabled cert-manager image v${VERSION}" \
            || gh release edit "v${VERSION}" \
                 --repo "${{ github.repository }}" \
                 --title "v${VERSION}"
          gh release upload "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --clobber \
            sbom/*.cdx.json
